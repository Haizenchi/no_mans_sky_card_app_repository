<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Emblème Atlas stylisé</title>
  <desc id="desc">Emblème géométrique doré et cyan inspiré de l'Atlas.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd36a"/>
      <stop offset="0.48" stop-color="#e8a72b"/>
      <stop offset="1" stop-color="#b97815"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62dcff"/>
      <stop offset="1" stop-color="#1395c6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M48 6 83 48 48 90 13 48Z" stroke="url(#gold)" stroke-width="5.5" filter="url(#glow)"/>
    <path d="M48 14 72 48 48 82 24 48Z" stroke="#e8a72b" stroke-opacity=".55" stroke-width="2"/>
    <path d="M48 10v29M48 57v29" stroke="url(#gold)" stroke-width="4"/>
    <path d="M20 48c7.5-13 18-19 28-19s20.5 6 28 19c-7.5 13-18 19-28 19S27.5 61 20 48Z" stroke="url(#cyan)" stroke-width="4.5" filter="url(#glow)"/>
    <path d="M25 48c6-8.5 13.6-12 23-12s17 3.5 23 12c-6 8.5-13.6 12-23 12s-17-3.5-23-12Z" stroke="url(#gold)" stroke-width="3.4"/>
  </g>
  <circle cx="48" cy="48" r="8.5" fill="url(#gold)" filter="url(#glow)"/>
  <circle cx="48" cy="48" r="3.4" fill="#fff2bf"/>
  <circle cx="48" cy="48" r="1.7" fill="#14263a"/>
  <path d="M11 48h7M78 48h7" stroke="#58d7ff" stroke-width="2" stroke-linecap="round" opacity=".8"/>
</svg>
