<!doctype html>
<!-- NMS Passport v2.1 — création Haizenchi -->
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#10233a" />
  <meta name="author" content="Haizenchi" />
  <meta name="creator" content="Haizenchi" />
  <meta name="application-name" content="NMS Passport" />
  <meta name="description" content="Générateur communautaire de cartes de voyageur, vaisseau, base et découverte pour No Man's Sky." />
  <title>NMS Passport — Atlas Identity Toolkit</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-author="Haizenchi">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <img src="assets/icons/atlas-emblem.svg" alt="" class="atlas-mark-svg" />
      </span>
      <div>
        <strong>NMS Passport</strong>
        <span>Atlas Identity Toolkit <b>v2.1</b></span>
      </div>
    </div>
    <div class="top-actions">
      <button id="installPwa" class="ghost" type="button" hidden>Installer l’app</button>
      <button id="previewOnly" class="ghost" type="button">Aperçu seul</button>
    </div>
  </header>

  <section class="workspace-tools" aria-label="Gestion des profils">
    <div class="profile-zone">
      <label for="profileSelect">Profils locaux</label>
      <select id="profileSelect"><option value="">— Session vierge —</option></select>
      <button id="saveProfile" class="secondary" type="button">Enregistrer</button>
      <button id="newProfile" class="secondary" type="button">Nouveau</button>
      <button id="deleteProfile" class="danger" type="button" disabled>Supprimer</button>
    </div>
    <div class="data-zone">
      <button id="exportJson" class="secondary" type="button">Exporter JSON</button>
      <label class="file-label compact" for="importJson">Importer JSON</label>
      <input id="importJson" type="file" accept="application/json,.json" hidden />
      <button id="copyShare" class="secondary" type="button">Copier le lien</button>
    </div>
  </section>

  <nav class="module-tabs" aria-label="Modules du passeport">
    <button class="module-tab active" data-module="identity" type="button"><span>01</span> Identité</button>
    <button class="module-tab" data-module="ship" type="button"><span>02</span> Vaisseau</button>
    <button class="module-tab" data-module="base" type="button"><span>03</span> Base</button>
    <button class="module-tab" data-module="discovery" type="button"><span>04</span> Découverte</button>
  </nav>

  <main class="app" id="app">
    <section class="preview-card">
      <div class="preview-head">
        <div>
          <strong id="previewTitle">Accréditation Atlas</strong>
          <span id="serialPreview">AT-E01-CP-XXXX-16</span>
        </div>
        <span class="local-pill"><i></i> Traitement local</span>
      </div>
      <div class="canvas-wrap">
        <canvas id="card" width="1600" height="1000" aria-label="Aperçu de la carte"></canvas>
      </div>
    </section>

    <aside class="panel" id="editorPanel">
      <div class="panel-top-grid">
        <div class="field">
          <label for="theme">Thème</label>
          <select id="theme">
            <option value="atlas">Atlas</option>
            <option value="korvax">Korvax</option>
            <option value="vykeen">Vy’keen</option>
            <option value="gek">Gek</option>
            <option value="autophage">Autophage</option>
          </select>
        </div>
        <div class="field">
          <label for="exportFormat">Format PNG</label>
          <select id="exportFormat">
            <option value="card">Carte 16:10</option>
            <option value="square">Carré 1:1</option>
            <option value="banner">Bannière 16:9</option>
          </select>
        </div>
      </div>

      <section class="module-form active" data-form="identity">
        <h2>Identité du voyageur</h2>
        <div class="field"><label for="idName">Nom <small>32 caractères</small></label><input id="idName" type="text" maxlength="32" autocomplete="off" /></div>
        <div class="two-col">
          <div class="field"><label for="idRace">Race</label><input id="idRace" type="text" maxlength="24" autocomplete="off" /></div>
          <div class="field"><label for="idRole">Fonction</label><select id="idRole"></select></div>
        </div>
        <div class="field code-field"><label for="idCode">Code voyageur</label><div class="inline"><input id="idCode" type="text" maxlength="26" autocomplete="off" spellcheck="false" /><button id="generateCode" class="secondary small" type="button">Générer</button></div></div>
        <div class="field"><label for="idDiscord">Discord</label><input id="idDiscord" type="text" maxlength="32" autocomplete="off" spellcheck="false" /></div>
        <div class="two-col">
          <div class="field"><label for="idGalaxy">Galaxie</label><select id="idGalaxy"></select></div>
          <div class="field"><label for="idGalaxyCustom">Nom personnalisé</label><input id="idGalaxyCustom" type="text" maxlength="28" placeholder="Optionnel" autocomplete="off" /></div>
        </div>
        <div class="divider"></div>
        <div class="field"><label>Portrait <small>JPG / PNG / WEBP</small></label><div class="file"><label class="file-label" for="identityMedia">Choisir une image</label><input id="identityMedia" type="file" accept="image/png,image/jpeg,image/webp" hidden /><button class="secondary media-remove" data-media-remove="identity" type="button">Retirer</button></div></div>
        <div class="media-tools" data-media-tools="identity" hidden></div>
        <div class="divider"></div>
        <div class="glyph-section" data-glyph-section="identity"></div>
      </section>

      <section class="module-form" data-form="ship">
        <h2>Fiche vaisseau</h2>
        <div class="field"><label for="shipName">Nom du vaisseau</label><input id="shipName" type="text" maxlength="38" autocomplete="off" /></div>
        <div class="two-col">
          <div class="field"><label for="shipType">Type</label><input id="shipType" type="text" maxlength="24" placeholder="Chasseur, Corvette…" autocomplete="off" /></div>
          <div class="field"><label for="shipClass">Classe</label><select id="shipClass"><option value="">—</option><option>C</option><option>B</option><option>A</option><option>S</option></select></div>
        </div>
        <div class="two-col"><div class="field"><label for="shipSystem">Système</label><input id="shipSystem" type="text" maxlength="30" autocomplete="off" /></div><div class="field"><label for="shipGalaxy">Galaxie</label><select id="shipGalaxy"></select></div></div>
        <div class="stats-grid">
          <div class="field"><label for="shipDamage">Dégâts</label><input id="shipDamage" type="text" maxlength="12" inputmode="decimal" /></div>
          <div class="field"><label for="shipShield">Bouclier</label><input id="shipShield" type="text" maxlength="12" inputmode="decimal" /></div>
          <div class="field"><label for="shipHyperdrive">Hyperpropulsion</label><input id="shipHyperdrive" type="text" maxlength="12" inputmode="decimal" /></div>
          <div class="field"><label for="shipManeuver">Maniabilité</label><input id="shipManeuver" type="text" maxlength="12" inputmode="decimal" /></div>
        </div>
        <div class="divider"></div>
        <div class="field"><label>Capture du vaisseau</label><div class="file"><label class="file-label" for="shipMedia">Choisir une image</label><input id="shipMedia" type="file" accept="image/png,image/jpeg,image/webp" hidden /><button class="secondary media-remove" data-media-remove="ship" type="button">Retirer</button></div></div>
        <div class="media-tools" data-media-tools="ship" hidden></div>
        <div class="divider"></div>
        <div class="glyph-section" data-glyph-section="ship"></div>
      </section>

      <section class="module-form" data-form="base">
        <h2>Fiche de base</h2>
        <div class="field"><label for="baseName">Nom de la base</label><input id="baseName" type="text" maxlength="38" autocomplete="off" /></div>
        <div class="two-col"><div class="field"><label for="baseType">Type</label><input id="baseType" type="text" maxlength="24" placeholder="Avant-poste, ferme…" /></div><div class="field"><label for="baseGalaxy">Galaxie</label><select id="baseGalaxy"></select></div></div>
        <div class="two-col"><div class="field"><label for="basePlanet">Planète</label><input id="basePlanet" type="text" maxlength="30" /></div><div class="field"><label for="baseSystem">Système</label><input id="baseSystem" type="text" maxlength="30" /></div></div>
        <div class="field"><label for="baseNote">Description courte</label><textarea id="baseNote" maxlength="110" rows="3" placeholder="Vue, fonction, services, particularité…"></textarea></div>
        <div class="divider"></div>
        <div class="field"><label>Capture de la base</label><div class="file"><label class="file-label" for="baseMedia">Choisir une image</label><input id="baseMedia" type="file" accept="image/png,image/jpeg,image/webp" hidden /><button class="secondary media-remove" data-media-remove="base" type="button">Retirer</button></div></div>
        <div class="media-tools" data-media-tools="base" hidden></div>
        <div class="divider"></div>
        <div class="glyph-section" data-glyph-section="base"></div>
      </section>

      <section class="module-form" data-form="discovery">
        <h2>Fiche de découverte</h2>
        <div class="field"><label for="discName">Nom</label><input id="discName" type="text" maxlength="38" autocomplete="off" /></div>
        <div class="two-col"><div class="field"><label for="discCategory">Catégorie</label><select id="discCategory"><option value="">—</option><option>Planète</option><option>Faune</option><option>Flore</option><option>Minéral</option><option>Lieu remarquable</option><option>Épave</option></select></div><div class="field"><label for="discGalaxy">Galaxie</label><select id="discGalaxy"></select></div></div>
        <div class="two-col"><div class="field"><label for="discPlanet">Planète</label><input id="discPlanet" type="text" maxlength="30" /></div><div class="field"><label for="discSystem">Système</label><input id="discSystem" type="text" maxlength="30" /></div></div>
        <div class="two-col"><div class="field"><label for="discBiome">Biome</label><input id="discBiome" type="text" maxlength="24" /></div><div class="field"><label for="discWeather">Météo</label><input id="discWeather" type="text" maxlength="24" /></div></div>
        <div class="two-col"><div class="field"><label for="discSentinels">Sentinelles</label><input id="discSentinels" type="text" maxlength="24" /></div><div class="field"><label for="discResources">Ressources</label><input id="discResources" type="text" maxlength="32" /></div></div>
        <div class="divider"></div>
        <div class="field"><label>Capture de la découverte</label><div class="file"><label class="file-label" for="discoveryMedia">Choisir une image</label><input id="discoveryMedia" type="file" accept="image/png,image/jpeg,image/webp" hidden /><button class="secondary media-remove" data-media-remove="discovery" type="button">Retirer</button></div></div>
        <div class="media-tools" data-media-tools="discovery" hidden></div>
        <div class="divider"></div>
        <div class="glyph-section" data-glyph-section="discovery"></div>
      </section>

      <div class="export-zone">
        <div class="field"><label for="resolution">Qualité</label><select id="resolution"><option value="1">Standard</option><option value="1.5" selected>Haute qualité</option><option value="2">Très haute qualité</option></select></div>
        <button id="download" class="primary" type="button">Exporter en PNG</button>
        <button id="resetModule" class="secondary" type="button">Réinitialiser ce module</button>
        <div class="status" id="status" aria-live="polite"></div>
      </div>
    </aside>
  </main>

  <dialog id="glyphDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-head"><strong>Choisir un glyphe</strong><button value="cancel" class="icon-btn" aria-label="Fermer">×</button></div>
      <div id="glyphPalette" class="glyph-palette"></div>
      <button id="clearGlyph" value="none" class="secondary" type="button">Vider cet emplacement</button>
    </form>
  </dialog>

  <script src="script/vendor/qrcode-browser.js"></script>
  <script src="script/script.js"></script>
</body>
</html>
