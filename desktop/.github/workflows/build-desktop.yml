name: Build NMS Passport Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Windows application
        working-directory: desktop
        run: npm run desktop:build -- --bundles nsis

      - name: Prepare Windows artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'dist/windows'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $portable = 'desktop/src-tauri/target/release/nms-passport.exe'
          if (-not (Test-Path $portable)) { throw "Portable executable not found: $portable" }
          Copy-Item $portable "$dist/NMS-Passport.exe"

          $setup = Get-ChildItem 'desktop/src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'NSIS installer not found' }
          Copy-Item $setup.FullName "$dist/NMS-Passport-Setup.exe"

          $lines = @()
          Get-ChildItem "$dist/*.exe" | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash  $($_.Name)"
          }
          $lines | Set-Content "$dist/SHA256SUMS.txt" -Encoding ascii

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: NMS-Passport-Desktop-v2.0.0-Windows
          path: dist/windows/*
          if-no-files-found: error
