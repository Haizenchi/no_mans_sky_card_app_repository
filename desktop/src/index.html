<!doctype html>
<!-- NMS Passport Desktop v1.0.0 — Web core v2.2 — Haizenchi -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#10233a" />
  <meta name="author" content="Haizenchi" />
  <meta name="creator" content="Haizenchi" />
  <meta name="application-name" content="NMS Passport" />
  <meta name="description" content="Community toolkit for creating Traveller, ship, base and discovery cards for No Man's Sky." />
  <title>NMS Passport Desktop</title>
  <link rel="icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-author="Haizenchi">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <img src="assets/icons/atlas-emblem.svg" alt="" class="atlas-mark-svg" />
      </span>
      <div>
        <strong>NMS Passport</strong>
        <span>Atlas Identity Toolkit <b>v2.2 · Desktop</b></span>
      </div>
    </div>
    <div class="top-actions">
      <label class="language-control" for="languageSelect">
        <span data-i18n="ui.language">Language</span>
        <select id="languageSelect" aria-label="Language">
          <option value="en">EN</option>
          <option value="fr">FR</option>
        </select>
      </label>
      <button id="installPwa" class="ghost" type="button" hidden data-i18n="ui.installApp">Install app</button>
      <button id="previewOnly" class="ghost" type="button" data-i18n="ui.previewOnly">Preview only</button>
    </div>
  </header>

  <section class="workspace-tools" data-i18n-aria="aria.profileManagement" aria-label="Profile management">
    <div class="profile-zone">
      <label for="profileSelect" data-i18n="ui.localProfiles">Local profiles</label>
      <select id="profileSelect"><option value="" data-i18n="ui.blankSession">— Blank session —</option></select>
      <button id="saveProfile" class="secondary" type="button" data-i18n="ui.save">Save</button>
      <button id="newProfile" class="secondary" type="button" data-i18n="ui.new">New</button>
      <button id="deleteProfile" class="danger" type="button" disabled data-i18n="ui.delete">Delete</button>
    </div>
    <div class="data-zone">
      <button id="exportJson" class="secondary" type="button" data-i18n="ui.exportJson">Export JSON</button>
      <label class="file-label compact" for="importJson" data-i18n="ui.importJson">Import JSON</label>
      <input id="importJson" type="file" accept="application/json,.json" hidden />
      <button id="copyShare" class="secondary" type="button" data-i18n="ui.copyLink">Copy link</button>
    </div>
  </section>

  <nav class="module-tabs" data-i18n-aria="aria.modules" aria-label="Passport modules">
    <button class="module-tab active" data-module="identity" type="button"><span>01</span> <b data-i18n="ui.identity">Identity</b></button>
    <button class="module-tab" data-module="ship" type="button"><span>02</span> <b data-i18n="ui.ship">Ship</b></button>
    <button class="module-tab" data-module="base" type="button"><span>03</span> <b data-i18n="ui.base">Base</b></button>
    <button class="module-tab" data-module="discovery" type="button"><span>04</span> <b data-i18n="ui.discovery">Discovery</b></button>
  </nav>

  <main class="app" id="app">
    <section class="preview-card">
      <div class="preview-head">
        <div>
          <strong id="previewTitle">Atlas Accreditation</strong>
          <span id="serialPreview">AT-E01-CP-XXXX-16</span>
        </div>
        <span class="local-pill"><i></i> <b data-i18n="ui.localProcessing">Local processing</b></span>
      </div>
      <div class="canvas-wrap">
        <canvas id="card" width="1600" height="1000" data-i18n-aria="aria.cardPreview" aria-label="Card preview"></canvas>
      </div>
    </section>

    <aside class="panel" id="editorPanel">
      <div class="panel-top-grid">
        <div class="field">
          <label for="theme" data-i18n="ui.theme">Theme</label>
          <select id="theme">
            <option value="atlas">Atlas</option>
            <option value="korvax">Korvax</option>
            <option value="vykeen">Vy’keen</option>
            <option value="gek">Gek</option>
            <option value="autophage">Autophage</option>
          </select>
        </div>
        <div class="field">
          <label for="exportFormat" data-i18n="ui.pngFormat">PNG format</label>
          <select id="exportFormat">
            <option value="card" data-i18n="ui.cardFormat">Card 16:10</option>
            <option value="square" data-i18n="ui.squareFormat">Square 1:1</option>
            <option value="banner" data-i18n="ui.bannerFormat">Banner 16:9</option>
          </select>
        </div>
      </div>

      <section class="module-form active" data-form="identity">
        <h2 data-i18n="ui.identityHeading">Traveller identity</h2>
        <div class="field"><label for="idName"><span data-i18n="ui.name">Name</span> <small data-i18n="ui.max32">32 characters</small></label><input id="idName" type="text" maxlength="32" autocomplete="off" /></div>
        <div class="two-col">
          <div class="field"><label for="idRace" data-i18n="ui.race">Race</label><input id="idRace" type="text" maxlength="24" autocomplete="off" /></div>
          <div class="field"><label for="idRole" data-i18n="ui.role">Role</label><select id="idRole"></select></div>
        </div>
        <div class="field code-field"><label for="idCode" data-i18n="ui.travellerCode">Traveller code</label><div class="inline"><input id="idCode" type="text" maxlength="26" autocomplete="off" spellcheck="false" /><button id="generateCode" class="secondary small" type="button" data-i18n="ui.generate">Generate</button></div></div>
        <div class="field"><label for="idDiscord">Discord</label><input id="idDiscord" type="text" maxlength="32" autocomplete="off" spellcheck="false" /></div>
        <div class="two-col">
          <div class="field"><label for="idGalaxy" data-i18n="ui.galaxy">Galaxy</label><select id="idGalaxy"></select></div>
          <div class="field"><label for="idGalaxyCustom" data-i18n="ui.customName">Custom name</label><input id="idGalaxyCustom" type="text" maxlength="28" data-i18n-placeholder="ui.optional" placeholder="Optional" autocomplete="off" /></div>
        </div>
        <div class="divider"></div>
        <div class="field"><label><span data-i18n="ui.portrait">Portrait</span> <small>JPG / PNG / WEBP</small></label><div class="file"><label class="file-label" for="identityMedia" data-i18n="ui.chooseImage">Choose image</label><input id="identityMedia" type="file" accept="image/png,image/jpeg,image/webp" hidden /><button class="secondary media-remove" data-media-remove="identity" type="button" data-i18n="ui.remove">Remove</button></div></div>
        <div class="media-tools" data-media-tools="identity" hidden></div>
        <div class="divider"></div>
        <div class="glyph-section" data-glyph-section="identity"></div>
      </section>

      <section class="module-form" data-form="ship">
        <h2 data-i18n="ui.shipHeading">Ship record</h2>
        <div class="field"><label for="shipName" data-i18n="ui.shipName">Ship name</label><input id="shipName" type="text" maxlength="38" autocomplete="off" /></div>
        <div class="two-col">
          <div class="field"><label for="shipType" data-i18n="ui.type">Type</label><input id="shipType" type="text" maxlength="24" data-i18n-placeholder="ui.shipTypePlaceholder" placeholder="Fighter, Corvette…" autocomplete="off" /></div>
          <div class="field"><label for="shipClass" data-i18n="ui.class">Class</label><select id="shipClass"><option value="">—</option><option>C</option><option>B</option><option>A</option><option>S</option></select></div>
        </div>
        <div class="two-col"><div class="field"><label for="shipSystem" data-i18n="ui.system">System</label><input id="shipSystem" type="text" maxlength="30" autocomplete="off" /></div><div class="field"><label for="shipGalaxy" data-i18n="ui.galaxy">Galaxy</label><select id="shipGalaxy"></select></div></div>
        <div class="stats-grid">
          <div class="field"><label for="shipDamage" data-i18n="ui.damage">Damage</label><input id="shipDamage" type="text" maxlength="12" inputmode="decimal" /></div>
          <div class="field"><label for="shipShield" data-i18n="ui.shield">Shield</label><input id="shipShield" type="text" maxlength="12" inputmode="decimal" /></div>
          <div class="field"><label for="shipHyperdrive" data-i18n="ui.hyperdrive">Hyperdrive</label><input id="shipHyperdrive" type="text" maxlength="12" inputmode="decimal" /></div>
          <div class="field"><label for="shipManeuver" data-i18n="ui.maneuverability">Maneuverability</label><input id="shipManeuver" type="text" maxlength="12" inputmode="decimal" /></div>
        </div>
        <div class="divider"></div>
        <div class="field"><label data-i18n="ui.shipCapture">Ship screenshot</label><div class="file"><label class="file-label" for="shipMedia" data-i18n="ui.chooseImage">Choose image</label><input id="shipMedia" type="file" accept="image/png,image/jpeg,image/webp" hidden /><button class="secondary media-remove" data-media-remove="ship" type="button" data-i18n="ui.remove">Remove</button></div></div>
        <div class="media-tools" data-media-tools="ship" hidden></div>
        <div class="divider"></div>
        <div class="glyph-section" data-glyph-section="ship"></div>
      </section>

      <section class="module-form" data-form="base">
        <h2 data-i18n="ui.baseHeading">Base record</h2>
        <div class="field"><label for="baseName" data-i18n="ui.baseName">Base name</label><input id="baseName" type="text" maxlength="38" autocomplete="off" /></div>
        <div class="two-col"><div class="field"><label for="baseType" data-i18n="ui.type">Type</label><input id="baseType" type="text" maxlength="24" data-i18n-placeholder="ui.baseTypePlaceholder" placeholder="Outpost, farm…" /></div><div class="field"><label for="baseGalaxy" data-i18n="ui.galaxy">Galaxy</label><select id="baseGalaxy"></select></div></div>
        <div class="two-col"><div class="field"><label for="basePlanet" data-i18n="ui.planet">Planet</label><input id="basePlanet" type="text" maxlength="30" /></div><div class="field"><label for="baseSystem" data-i18n="ui.system">System</label><input id="baseSystem" type="text" maxlength="30" /></div></div>
        <div class="field"><label for="baseNote" data-i18n="ui.shortDescription">Short description</label><textarea id="baseNote" maxlength="110" rows="3" data-i18n-placeholder="ui.baseNotePlaceholder" placeholder="View, purpose, services, notable features…"></textarea></div>
        <div class="divider"></div>
        <div class="field"><label data-i18n="ui.baseCapture">Base screenshot</label><div class="file"><label class="file-label" for="baseMedia" data-i18n="ui.chooseImage">Choose image</label><input id="baseMedia" type="file" accept="image/png,image/jpeg,image/webp" hidden /><button class="secondary media-remove" data-media-remove="base" type="button" data-i18n="ui.remove">Remove</button></div></div>
        <div class="media-tools" data-media-tools="base" hidden></div>
        <div class="divider"></div>
        <div class="glyph-section" data-glyph-section="base"></div>
      </section>

      <section class="module-form" data-form="discovery">
        <h2 data-i18n="ui.discoveryHeading">Discovery record</h2>
        <div class="field"><label for="discName" data-i18n="ui.name">Name</label><input id="discName" type="text" maxlength="38" autocomplete="off" /></div>
        <div class="two-col"><div class="field"><label for="discCategory" data-i18n="ui.category">Category</label><select id="discCategory"></select></div><div class="field"><label for="discGalaxy" data-i18n="ui.galaxy">Galaxy</label><select id="discGalaxy"></select></div></div>
        <div class="two-col"><div class="field"><label for="discPlanet" data-i18n="ui.planet">Planet</label><input id="discPlanet" type="text" maxlength="30" /></div><div class="field"><label for="discSystem" data-i18n="ui.system">System</label><input id="discSystem" type="text" maxlength="30" /></div></div>
        <div class="two-col"><div class="field"><label for="discBiome">Biome</label><input id="discBiome" type="text" maxlength="24" /></div><div class="field"><label for="discWeather" data-i18n="ui.weather">Weather</label><input id="discWeather" type="text" maxlength="24" /></div></div>
        <div class="two-col"><div class="field"><label for="discSentinels" data-i18n="ui.sentinels">Sentinels</label><input id="discSentinels" type="text" maxlength="24" /></div><div class="field"><label for="discResources" data-i18n="ui.resources">Resources</label><input id="discResources" type="text" maxlength="32" /></div></div>
        <div class="divider"></div>
        <div class="field"><label data-i18n="ui.discoveryCapture">Discovery screenshot</label><div class="file"><label class="file-label" for="discoveryMedia" data-i18n="ui.chooseImage">Choose image</label><input id="discoveryMedia" type="file" accept="image/png,image/jpeg,image/webp" hidden /><button class="secondary media-remove" data-media-remove="discovery" type="button" data-i18n="ui.remove">Remove</button></div></div>
        <div class="media-tools" data-media-tools="discovery" hidden></div>
        <div class="divider"></div>
        <div class="glyph-section" data-glyph-section="discovery"></div>
      </section>

      <div class="export-zone">
        <div class="field"><label for="resolution" data-i18n="ui.quality">Quality</label><select id="resolution"><option value="1" data-i18n="ui.standard">Standard</option><option value="1.5" selected data-i18n="ui.highQuality">High quality</option><option value="2" data-i18n="ui.veryHighQuality">Very high quality</option></select></div>
        <button id="download" class="primary" type="button" data-i18n="ui.exportPng">Export PNG</button>
        <button id="resetModule" class="secondary" type="button" data-i18n="ui.resetModule">Reset this module</button>
        <div class="status" id="status" aria-live="polite"></div>
      </div>
    </aside>
  </main>

  <dialog id="glyphDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-head"><strong data-i18n="ui.chooseGlyph">Choose a glyph</strong><button value="cancel" class="icon-btn" data-i18n-aria="aria.close" aria-label="Close">×</button></div>
      <div id="glyphPalette" class="glyph-palette"></div>
      <button id="clearGlyph" value="none" class="secondary" type="button" data-i18n="ui.clearSlot">Clear this slot</button>
    </form>
  </dialog>

  <script src="script/vendor/qrcode-browser.js"></script>
  <script src="script/script.js"></script>
</body>
</html>
